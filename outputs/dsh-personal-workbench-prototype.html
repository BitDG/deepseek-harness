uestion=q;state.aiSelection='';render();break}case 'send-main':{const v=document.getElementById('main-compose')?.value.trim();if(!v){document.getElementById('main-compose')?.focus();break}state.chatMessages.push({role:'user',text:v},{role:'assistant',text:'这里展示对话界面效果；此 HTML 未连接模型服务。'});render();break}case 'music-play':state.music=!state.music;render();break;case 'rss-star':state.starred.has(state.article)?state.starred.delete(state.article):state.starred.add(state.article);render();break;case 'rss-refresh':toast('文章列表已刷新（原型数据）');break;case 'rss-save':toast('保存操作在原型中仅展示交互');break;case 'rss-origin':toast('原文链接将在正式接入 RSS 数据后打开');break;case 'rss-add':toast('添加订阅源将在正式实现中打开设置');break;case 'git-refresh':toast('Git 状态已刷新（原型数据）');break;case 'git-commit':case 'git-pull':case 'git-push':case 'git-all':case 'git-history':case 'branch':toast('Git 控件当前用于界面预览');break;case 'close-file-tab':state.file='';render();break;case 'new-tab':toast('新建文件标签页预览');break;case 'attach':toast('附件入口预览');break;case 'panel':toast('侧边面板入口预览');break;case 'collapse':toast('该原型聚焦桌面展开状态');break;default:break}});
    app.addEventListener('input',event=>{if(event.target.id!=='file-filter')return;const term=event.target.value.trim().toLowerCase();document.querySelectorAll('.file-tree .list-row').forEach(row=>{row.hidden=term!==''&&!row.textContent.toLowerCase().includes(term)})});
    app.addEventListener('click',event=>{const action=event.target.closest('[data-act]');if(!action)return;const name=action.dataset.act;if(name==='open-modal'){queueMicrotask(()=>document.querySelector('.modal .modal-close')?.focus());return}if(name==='close-ai'||((name==='close-search'||name==='close-modal')&&(event.target===action||action.classList.contains('modal-close')))){const selector=name==='close-ai'?'[data-act="ask-ai"]':name==='close-search'?'[data-act="search"]':'[data-act="open-modal"]';queueMicrotask(()=>document.querySelector(selector)?.focus())}},true);
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.modal||state.search){const wasSearch=state.search;state.modal=false;state.search=false;render();document.querySelector(wasSearch?'[data-act="search"]':'[data-act="open-modal"]')?.focus()}else if(state.aiOpen){state.aiOpen=false;render();document.querySelector('[data-act="ask-ai"]')?.focus()}}if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){if(document.activeElement?.id==='ai-question'){event.preventDefault();document.querySelector('[data-act="send-ai"]')?.click()}else if(document.activeElement?.id==='main-compose'){event.preventDefault();document.querySelector('[data-act="send-main"]')?.click()}}});
    render();
  </script>
</body>
</html>
